# cargo-deny: run by CI (dependencies job) and weekly (audit.yml).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Every platform we ship, so platform-specific dependencies are checked too.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail everywhere in the tree. "Unmaintained" notices only fail
# for our direct dependencies: deep in iced's tree (zbus, zvariant…) there is
# nothing to switch to until upstream moves, and Dependabot tracks that.
unmaintained = "workspace"
# Add an advisory here only with a written reason and an expiry plan.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences compatible with distributing an MIT application.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
# Duplicates are common in a GUI dependency tree; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
