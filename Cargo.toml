[workspace]
resolver = "3"
members = ["crates/core", "crates/updater", "crates/app", "xtask"]
default-members = ["crates/core", "crates/updater", "crates/app"]

# The single source of truth for the application version. Bump it (and add a
# CHANGELOG.md section) to release: the Release workflow refuses to rebuild a
# version that already has a tag.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Damien Reichhart"]
repository = "https://github.com/DamienReichhart/Coffer"
homepage = "https://damienreichhart.github.io/Coffer/"

[workspace.dependencies]
coffer-core = { path = "crates/core" }
coffer-updater = { path = "crates/updater" }

anyhow = "1.0.104"
async-stream = "0.3.6"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-core = "0.3.34"
futures-util = "0.3.34"
iced = { version = "0.14.0", default-features = false }
iced_test = "0.14.0"
minisign = "0.10.0"
minisign-verify = "0.3.0"
open = "5.4.5"
png = "0.18.1"
resvg = "0.50.0"
rfd = { version = "0.18.0", default-features = false }
self-replace = "1.5.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = "1.0.229"
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
ureq = { version = "3.5.2", default-features = false }
which = "8.0.6"
winreg = "0.56.0"
zip = { version = "9.5.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight readable UI and CLI code more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Fast, optimised builds of dependencies while developing: iced is slow unoptimised.
[profile.dev.package."*"]
opt-level = 2
